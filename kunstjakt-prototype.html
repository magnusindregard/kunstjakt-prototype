<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kunstjakt – Prototype</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1e2126;
    --text: #f5f2ec;
    --muted: #a6a9af;
    --accent: #c0392b;
    --accent-active: #e74c3c;
    --focus: #4a90d9;
    --correct: #2ecc71;
    --incorrect: #e74c3c;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- Login screen ---------- */

  #login-screen {
    justify-content: center;
    gap: 28px;
    padding: 24px;
  }

  #login-screen h1 {
    font-size: clamp(32px, 6vw, 56px);
    margin: 0;
    letter-spacing: 0.02em;
  }

  #login-form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  #login-id {
    font-size: 32px;
    letter-spacing: 0.3em;
    text-align: center;
    width: 220px;
    padding: 14px 10px;
    border-radius: 12px;
    border: 2px solid #3a3d44;
    background: var(--panel);
    color: var(--text);
    outline: none;
  }

  #login-id:focus { border-color: var(--focus); }

  #login-submit {
    font-size: 20px;
    padding: 12px 32px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
    opacity: 0.4;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  #login-submit.enabled {
    opacity: 1;
    pointer-events: auto;
  }

  #login-error {
    color: var(--muted);
    font-size: 14px;
    min-height: 18px;
  }

  /* ---------- Task screen ---------- */

  #task-screen {
    display: none;
    justify-content: flex-start;
    padding: 32px 24px 24px;
    gap: 8px;
  }

  #task-screen h1 {
    font-size: clamp(24px, 4vw, 36px);
    margin: 0;
    text-align: center;
  }

  #task-instruction {
    color: var(--muted);
    font-size: clamp(15px, 2.2vw, 19px);
    text-align: center;
    max-width: 520px;
    margin: 4px 0 0;
  }

  #task-content {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 3vw, 32px);
    min-height: 0;
    opacity: 0;
  }

  #task-main {
    width: 100%;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 4vw, 48px);
    min-height: 0;
    padding: 0 clamp(16px, 4vw, 48px);
  }

  #task-question {
    flex: 0 1 260px;
    font-size: clamp(20px, 2.6vw, 30px);
    font-weight: 700;
    line-height: 1.3;
    text-align: right;
  }

  #task-main img {
    flex: 1 1 auto;
    max-width: min(55vw, 480px);
    max-height: 100%;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }

  #task-options {
    display: none;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    padding: 0 clamp(16px, 4vw, 48px);
  }

  #task-options.visible {
    display: flex;
  }

  .option-btn {
    font-size: clamp(15px, 1.8vw, 19px);
    padding: 12px 28px;
    border-radius: 999px;
    border: 2px solid #3a3d44;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }

  .option-btn:hover {
    border-color: var(--focus);
  }

  .option-btn:active,
  .option-btn.pressed {
    transform: scale(0.96);
  }

  @media (max-width: 700px) {
    #task-main {
      flex-direction: column;
      gap: 16px;
    }

    #task-question {
      flex: 0 0 auto;
      text-align: center;
    }

    #task-main img {
      max-width: min(90vw, 480px);
    }
  }

  /* ---------- Result screen ---------- */

  #result-screen {
    display: none;
    justify-content: center;
    gap: 16px;
  }

  #result-screen h1 {
    font-size: clamp(40px, 8vw, 72px);
    margin: 0;
  }

  #result-screen p {
    color: var(--muted);
    font-size: clamp(15px, 2vw, 18px);
    margin: 0;
  }

  #result-screen.correct h1 { color: var(--correct); }
  #result-screen.incorrect h1 { color: var(--incorrect); }

  /* ---------- Countdown bar (shared across all screens) ---------- */

  #countdown-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 5px;
    background: rgba(255, 255, 255, 0.08);
    z-index: 15;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  #countdown-bar.visible {
    opacity: 1;
  }

  #countdown-bar-fill {
    height: 100%;
    width: 100%;
    background: var(--accent-active);
    transform-origin: left center;
  }

  /* ---------- Circle ---------- */

  #circle-zone {
    position: fixed;
    right: max(24px, env(safe-area-inset-right));
    bottom: max(24px, env(safe-area-inset-bottom));
    z-index: 10;
  }

  #circle {
    width: 156px;
    height: 156px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  #circle.active {
    background: var(--accent-active);
    transform: scale(1.08);
    box-shadow: 0 0 0 14px rgba(231, 76, 60, 0.15);
  }

  #circle-label {
    color: var(--text);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    opacity: 0.9;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }

  #circle.active #circle-label {
    opacity: 0;
  }

  /* ---------- Debug / settings panel ---------- */

  #debug-toggle {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 20;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid #3a3d44;
    background: var(--panel);
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
  }

  #debug-panel {
    position: fixed;
    top: 56px;
    right: 14px;
    z-index: 20;
    width: 260px;
    background: var(--panel);
    border: 1px solid #3a3d44;
    border-radius: 12px;
    padding: 16px;
    font-size: 13px;
    display: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }

  #debug-panel.open { display: block; }

  #debug-panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 10px;
  }

  #debug-panel label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  #debug-panel input[type="number"] {
    width: 64px;
    padding: 4px 6px;
    border-radius: 6px;
    border: 1px solid #3a3d44;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
  }

  #debug-status {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #3a3d44;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
    white-space: pre;
  }

  #debug-status b { color: var(--text); }
</style>
</head>
<body>

  <!-- ===================== LOGIN SCREEN ===================== -->
  <div id="login-screen" class="screen">
    <h1>Kunstjakt</h1>
    <form id="login-form" autocomplete="off">
      <input
        id="login-id"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="4"
        placeholder="0000"
        autocomplete="off"
      >
      <div id="login-error"></div>
      <button type="submit" id="login-submit">Logg inn</button>
    </form>
  </div>

  <!-- ===================== TASK SCREEN ===================== -->
  <div id="task-screen" class="screen">
    <h1>Velkommen, Maja</h1>
    <p id="task-instruction">Dette er oppdrag 2 av 6. Hold fingeren din i den røde sirkelen for å se oppdraget ditt.</p>

    <div id="task-content">
      <div id="task-main">
        <div id="task-question">Hvor i Norge er dette motivet fra?</div>
        <img
          src="https://ms01.nasjonalmuseet.no/iip/?iiif=/tif/NG.M.04322+Publisering+20240220.tif/full/550,/0/default.jpg"
          alt="Oppdragsbilde"
          draggable="false"
        >
      </div>
      <div id="task-options">
        <button type="button" class="option-btn" data-answer="Bergen">Bergen</button>
        <button type="button" class="option-btn" data-answer="Geiranger">Geiranger</button>
        <button type="button" class="option-btn" data-answer="Jotunheimen">Jotunheimen</button>
        <button type="button" class="option-btn" data-answer="Nesodden">Nesodden</button>
      </div>
    </div>

    <div id="circle-zone">
      <div id="circle"><span id="circle-label">HOLD</span></div>
    </div>
  </div>

  <!-- ===================== RESULT SCREEN ===================== -->
  <div id="result-screen" class="screen">
    <h1 id="result-title">Riktig!</h1>
    <p>Går tilbake til innlogging...</p>
  </div>

  <!-- ===================== COUNTDOWN BAR (shared) ===================== -->
  <div id="countdown-bar">
    <div id="countdown-bar-fill"></div>
  </div>

  <!-- ===================== DEBUG / SETTINGS ===================== -->
  <button id="debug-toggle" title="Innstillinger">⚙</button>
  <div id="debug-panel">
    <h2>Timeout-mekanikk</h2>
    <label>
      Inaktivitet før nedtelling starter (s)
      <input type="number" id="cfg-init-wait" value="10" min="0" step="1">
    </label>
    <label>
      Fade inn (ms)
      <input type="number" id="cfg-fade-in" value="400" min="50" step="50">
    </label>
    <label>
      Ventetid før nedtoning (s)
      <input type="number" id="cfg-grace" value="1" min="0" step="1">
    </label>
    <label>
      Nedtoning, varighet (s)
      <input type="number" id="cfg-fadeout" value="7" min="1" step="1">
    </label>
    <label>
      Resultatskjerm, varighet (s)
      <input type="number" id="cfg-result" value="5" min="1" step="1">
    </label>
    <div id="debug-status"></div>
  </div>

  <script>
    (function () {
      "use strict";

      // ---- Config (live-editable via the settings panel) ----
      let INIT_WAIT_MS = 10000;
      let FADE_IN_MS = 400;
      let GRACE_MS = 1000;
      let FADE_OUT_MS = 7000;
      let RESULT_DISPLAY_MS = 5000;

      // ---- Elements ----
      const loginScreen = document.getElementById("login-screen");
      const taskScreen = document.getElementById("task-screen");
      const resultScreen = document.getElementById("result-screen");
      const resultTitle = document.getElementById("result-title");
      const loginForm = document.getElementById("login-form");
      const loginId = document.getElementById("login-id");
      const loginSubmit = document.getElementById("login-submit");
      const loginError = document.getElementById("login-error");
      const taskContent = document.getElementById("task-content");
      const taskInstruction = document.getElementById("task-instruction");
      const taskOptions = document.getElementById("task-options");
      const optionButtons = Array.from(document.querySelectorAll(".option-btn"));
      const circle = document.getElementById("circle");
      const countdownBar = document.getElementById("countdown-bar");
      const countdownBarFill = document.getElementById("countdown-bar-fill");

      const CORRECT_ANSWER = "Nesodden";
      const QUESTION_INSTRUCTION = "Dette er oppdrag 2 av 6. Hold fingeren din i den røde sirkelen for å se oppdraget ditt.";
      const ANSWER_INSTRUCTION = "Hold fingeren på den røde sirkelen for å løse oppdraget ditt.";

      const debugToggle = document.getElementById("debug-toggle");
      const debugPanel = document.getElementById("debug-panel");
      const cfgInitWait = document.getElementById("cfg-init-wait");
      const cfgFadeIn = document.getElementById("cfg-fade-in");
      const cfgGrace = document.getElementById("cfg-grace");
      const cfgFadeout = document.getElementById("cfg-fadeout");
      const cfgResult = document.getElementById("cfg-result");
      const debugStatus = document.getElementById("debug-status");

      // ---- State ----
      let holding = false;
      let idleTimer = null;
      let idleEndsAt = null;    // epoch ms
      let graceTimer = null;
      let fadeOutTimer = null;
      let graceEndsAt = null;   // epoch ms
      let fadeOutEndsAt = null; // epoch ms
      let statusTicker = null;
      let countdownRaf = null;
      let countdownStartedAt = null; // epoch ms
      let countdownTotalMs = 0;
      let loginCount = 0;
      let isAnswerMode = false;
      let resultTimer = null;

      // ================= Login =================

      loginId.addEventListener("input", () => {
        loginId.value = loginId.value.replace(/\D/g, "").slice(0, 4);
        loginSubmit.classList.toggle("enabled", loginId.value.length === 4);
        loginError.textContent = "";
      });

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        if (loginId.value.length !== 4) {
          loginError.textContent = "Skriv inn en 4-sifret kode.";
          return;
        }
        loginCount += 1;
        enterTaskScreen();
      });

      function enterTaskScreen() {
        isAnswerMode = loginCount % 2 === 0;
        taskInstruction.textContent = isAnswerMode ? ANSWER_INSTRUCTION : QUESTION_INSTRUCTION;
        taskOptions.classList.toggle("visible", isAnswerMode);

        loginScreen.style.display = "none";
        taskScreen.style.display = "flex";
        resetTaskState();

        readConfig();
        idleEndsAt = Date.now() + INIT_WAIT_MS;
        idleTimer = setTimeout(onIdleTimeout, INIT_WAIT_MS);

        startStatusTicker();
      }

      // If nothing happens for a while after login, treat it the same as an
      // unattended task: start the same return-to-login countdown that
      // normally begins when the circle is released.
      function onIdleTimeout() {
        idleTimer = null;
        idleEndsAt = null;
        startCountdown(FADE_OUT_MS);
        startFadeOut();
      }

      function returnToLogin() {
        clearTimers();
        stopStatusTicker();
        hideCountdown();
        taskScreen.style.display = "none";
        resultScreen.style.display = "none";
        loginScreen.style.display = "flex";
        loginId.value = "";
        loginSubmit.classList.remove("enabled");
        loginId.focus();
      }

      // ================= Hold / fade mechanic =================

      function resetTaskState() {
        clearTimers();
        if (resultTimer) { clearTimeout(resultTimer); resultTimer = null; }
        holding = false;
        circle.classList.remove("active");
        taskContent.style.transitionDuration = "0ms";
        taskContent.style.opacity = "0";
        taskContent.style.pointerEvents = "none";
        hideCountdown();
      }

      function clearTimers() {
        if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
        if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }
        if (fadeOutTimer) { clearTimeout(fadeOutTimer); fadeOutTimer = null; }
        idleEndsAt = null;
        graceEndsAt = null;
        fadeOutEndsAt = null;
      }

      // ================= Countdown bar =================
      // Shared visualization for every "time is running out" moment in the
      // app (task fade-out and result auto-return), so the mechanic reads
      // the same way regardless of which screen it appears on.

      function startCountdown(totalMs) {
        cancelCountdown();
        countdownTotalMs = totalMs;
        countdownStartedAt = Date.now();
        countdownBar.classList.add("visible");
        tickCountdown();
      }

      function tickCountdown() {
        const elapsed = Date.now() - countdownStartedAt;
        const fraction = countdownTotalMs > 0 ? Math.min(1, elapsed / countdownTotalMs) : 1;
        countdownBarFill.style.transform = "scaleX(" + (1 - fraction) + ")";
        if (fraction < 1) {
          countdownRaf = requestAnimationFrame(tickCountdown);
        }
      }

      function cancelCountdown() {
        if (countdownRaf) { cancelAnimationFrame(countdownRaf); countdownRaf = null; }
        countdownStartedAt = null;
      }

      function hideCountdown() {
        cancelCountdown();
        countdownBar.classList.remove("visible");
        countdownBarFill.style.transform = "scaleX(1)";
      }

      function readConfig() {
        INIT_WAIT_MS = Math.max(0, Number(cfgInitWait.value) || 0) * 1000;
        FADE_IN_MS = Math.max(0, Number(cfgFadeIn.value) || 0);
        GRACE_MS = Math.max(0, Number(cfgGrace.value) || 0) * 1000;
        FADE_OUT_MS = Math.max(1, Number(cfgFadeout.value) || 1) * 1000;
        RESULT_DISPLAY_MS = Math.max(1, Number(cfgResult.value) || 1) * 1000;
      }

      function fadeIn() {
        clearTimers();
        readConfig();
        taskContent.style.transitionDuration = FADE_IN_MS + "ms";
        taskContent.style.opacity = "1";
        taskContent.style.pointerEvents = "auto";
      }

      function onHoldStart(e) {
        if (e) e.preventDefault();
        holding = true;
        circle.classList.add("active");
        hideCountdown();
        fadeIn();
      }

      function onHoldEnd() {
        if (!holding) return;
        holding = false;
        circle.classList.remove("active");
        clearTimers();
        readConfig();
        graceEndsAt = Date.now() + GRACE_MS;
        graceTimer = setTimeout(startFadeOut, GRACE_MS);
        startCountdown(GRACE_MS + FADE_OUT_MS);
      }

      function startFadeOut() {
        readConfig();
        taskContent.style.transitionDuration = FADE_OUT_MS + "ms";
        taskContent.style.opacity = "0";
        fadeOutEndsAt = Date.now() + FADE_OUT_MS;
        fadeOutTimer = setTimeout(() => {
          returnToLogin();
        }, FADE_OUT_MS);
      }

      circle.addEventListener("pointerdown", onHoldStart);
      circle.addEventListener("pointerup", onHoldEnd);
      circle.addEventListener("pointercancel", onHoldEnd);
      circle.addEventListener("pointerleave", onHoldEnd);

      // ================= Answer mechanic =================

      // iOS Safari suppresses the synthetic "click" event on a touch that
      // overlaps another active touch (e.g. the held circle), so answer
      // selection has to be wired to raw pointer events instead — those are
      // reported independently per finger and work correctly with multitouch.
      optionButtons.forEach((button) => {
        button.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          button.classList.add("pressed");
        });

        const release = () => button.classList.remove("pressed");
        button.addEventListener("pointercancel", release);
        button.addEventListener("pointerleave", release);

        button.addEventListener("pointerup", (e) => {
          e.preventDefault();
          button.classList.remove("pressed");
          if (!isAnswerMode) return;
          selectAnswer(button.dataset.answer);
        });
      });

      function selectAnswer(answer) {
        clearTimers();
        hideCountdown();
        stopStatusTicker();
        taskScreen.style.display = "none";
        showResult(answer === CORRECT_ANSWER);
      }

      function showResult(correct) {
        readConfig();
        resultTitle.textContent = correct ? "Riktig!" : "Feil svar";
        resultScreen.classList.toggle("correct", correct);
        resultScreen.classList.toggle("incorrect", !correct);
        resultScreen.style.display = "flex";
        resultTimer = setTimeout(returnToLogin, RESULT_DISPLAY_MS);
        startCountdown(RESULT_DISPLAY_MS);
      }

      // ================= Debug panel =================

      debugToggle.addEventListener("click", () => {
        debugPanel.classList.toggle("open");
      });

      [cfgInitWait, cfgFadeIn, cfgGrace, cfgFadeout, cfgResult].forEach((input) => {
        input.addEventListener("change", readConfig);
      });

      function startStatusTicker() {
        stopStatusTicker();
        statusTicker = setInterval(updateStatus, 100);
        updateStatus();
      }

      function stopStatusTicker() {
        if (statusTicker) { clearInterval(statusTicker); statusTicker = null; }
        debugStatus.textContent = "";
      }

      function updateStatus() {
        const now = Date.now();
        let state, detail;

        if (holding) {
          state = "HOLDING";
          detail = "oppgave synlig";
        } else if (fadeOutEndsAt) {
          state = "TONER NED";
          detail = Math.max(0, (fadeOutEndsAt - now) / 1000).toFixed(1) + "s til pålogging";
        } else if (graceEndsAt) {
          state = "VENTER";
          detail = Math.max(0, (graceEndsAt - now) / 1000).toFixed(1) + "s til nedtoning starter";
        } else if (idleEndsAt) {
          state = "VENTER PÅ BERØRING";
          detail = Math.max(0, (idleEndsAt - now) / 1000).toFixed(1) + "s til nedtelling starter automatisk";
        } else {
          state = "IDLE";
          detail = "-";
        }

        debugStatus.textContent =
          "Status: " + state + "\n" +
          detail + "\n" +
          "opacity: " + getComputedStyle(taskContent).opacity;
      }

      // Init
      loginId.focus();
    })();
  </script>
</body>
</html>
