<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kunstjakt – Solution 2 (OK GO!)</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1e2126;
    --text: #f5f2ec;
    --muted: #a6a9af;
    --accent: #c0392b;
    --accent-active: #e74c3c;
    --focus: #4a90d9;
    --correct: #2ecc71;
    --incorrect: #e74c3c;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- Login screen ---------- */

  #login-screen {
    justify-content: center;
    gap: 28px;
    padding: 24px;
  }

  #login-screen h1 {
    font-size: clamp(32px, 6vw, 56px);
    margin: 0;
    letter-spacing: 0.02em;
  }

  #login-form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  #login-id {
    font-size: 32px;
    letter-spacing: 0.3em;
    text-align: center;
    width: 220px;
    padding: 14px 10px;
    border-radius: 12px;
    border: 2px solid #3a3d44;
    background: var(--panel);
    color: var(--text);
    outline: none;
  }

  #login-id:focus { border-color: var(--focus); }

  #login-submit {
    font-size: 20px;
    padding: 12px 32px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
    opacity: 0.4;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  #login-submit.enabled {
    opacity: 1;
    pointer-events: auto;
  }

  #login-error {
    color: var(--muted);
    font-size: 14px;
    min-height: 18px;
  }

  /* ---------- Task screen ---------- */

  #task-screen {
    display: none;
    justify-content: flex-start;
    padding: 32px 24px 40px;
    gap: 6px;
    transition-property: opacity;
    transition-timing-function: ease;
  }

  /* Logout link – always available, top right */
  #logout {
    position: fixed;
    top: 40px;
    right: 18px;
    z-index: 16;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: clamp(15px, 1.8vw, 18px);
    font-weight: 600;
    cursor: pointer;
    padding: 8px 6px;
  }
  #logout u { text-underline-offset: 4px; }
  #logout:active { opacity: 0.6; }

  #task-screen h1 {
    font-size: clamp(24px, 4vw, 36px);
    margin: 0;
    text-align: center;
  }

  #task-meta {
    color: var(--muted);
    font-size: clamp(15px, 2.2vw, 19px);
    text-align: center;
    margin: 0;
  }

  #task-content {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 3vw, 28px);
    min-height: 0;
  }

  #task-main {
    width: 100%;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 4vw, 48px);
    min-height: 0;
    padding: 0 clamp(16px, 4vw, 48px);
  }

  #task-question {
    flex: 0 1 320px;
    font-size: clamp(18px, 2.4vw, 26px);
    font-weight: 700;
    line-height: 1.35;
    text-align: right;
  }

  #task-main img {
    flex: 0 1 auto;
    max-width: min(45vw, 380px);
    max-height: 46vh;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }

  /* "OK, GO!" – only shown on first login (find mode) */
  #go-btn {
    display: none;
    font-size: clamp(22px, 3vw, 30px);
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 22px 60px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
    box-shadow: 0 8px 0 0 #7d2419;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
  }
  #go-btn.visible { display: inline-block; }
  #go-btn:hover { background: var(--accent-active); }
  #go-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 0 #7d2419; }

  /* Answer options – only shown on later logins (answer mode) */
  #task-options {
    display: none;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    padding: 0 clamp(16px, 4vw, 48px);
  }
  #task-options.visible { display: flex; }

  .option-btn {
    font-size: clamp(15px, 1.8vw, 19px);
    padding: 12px 28px;
    border-radius: 999px;
    border: 2px solid #3a3d44;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }

  .option-btn:hover { border-color: var(--focus); }
  .option-btn:active,
  .option-btn.pressed { transform: scale(0.96); }

  @media (max-width: 700px) {
    #task-main { flex-direction: column; gap: 16px; }
    #task-question { flex: 0 0 auto; text-align: center; }
    #task-main img { max-width: min(90vw, 380px); }
  }

  /* ---------- Result screen ---------- */

  #result-screen {
    display: none;
    justify-content: center;
    gap: 16px;
  }

  #result-screen h1 {
    font-size: clamp(40px, 8vw, 72px);
    margin: 0;
  }

  #result-screen p {
    color: var(--muted);
    font-size: clamp(15px, 2vw, 18px);
    margin: 0;
  }

  #result-screen.correct h1 { color: var(--correct); }
  #result-screen.incorrect h1 { color: var(--incorrect); }

  /* ---------- Countdown bar (shared across all screens) ---------- */

  #countdown-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 10px;
    background: rgba(255, 255, 255, 0.08);
    z-index: 15;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  #countdown-bar.visible { opacity: 1; }

  #countdown-bar-fill {
    height: 100%;
    width: 100%;
    background: var(--accent-active);
    transform-origin: left center;
  }

  /* ---------- Debug / settings panel ---------- */

  #debug-toggle {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 20;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid #3a3d44;
    background: var(--panel);
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
  }

  #debug-panel {
    position: fixed;
    top: 56px;
    left: 14px;
    z-index: 20;
    width: 280px;
    background: var(--panel);
    border: 1px solid #3a3d44;
    border-radius: 12px;
    padding: 16px;
    font-size: 13px;
    display: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }

  #debug-panel.open { display: block; }

  #debug-panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 10px;
  }

  #debug-panel label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  #debug-panel input[type="number"] {
    width: 64px;
    padding: 4px 6px;
    border-radius: 6px;
    border: 1px solid #3a3d44;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
  }

  #debug-status {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #3a3d44;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
    white-space: pre;
  }

  #debug-status b { color: var(--text); }
</style>
</head>
<body>

  <!-- ===================== LOGIN SCREEN ===================== -->
  <div id="login-screen" class="screen">
    <h1>Kunstjakt</h1>
    <form id="login-form" autocomplete="off">
      <input
        id="login-id"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="4"
        placeholder="0000"
        autocomplete="off"
      >
      <div id="login-error"></div>
      <button type="submit" id="login-submit">Logg inn</button>
    </form>
  </div>

  <!-- ===================== TASK SCREEN ===================== -->
  <div id="task-screen" class="screen">
    <h1>Velkommen, Maja</h1>
    <p id="task-meta">Oppdrag 2 av 6</p>

    <div id="task-content">
      <div id="task-main">
        <div id="task-question">Hva gjør personen fremst i båten?</div>
        <img
          src="https://ms01.nasjonalmuseet.no/iip/?iiif=/tif/NG.M.04322+Publisering+20240220.tif/full/550,/0/default.jpg"
          alt="Oppdragsbilde"
          draggable="false"
        >
      </div>

      <div id="task-hint">Finn maleriet «Brudeferden i Hardanger» av Hans Gude og Adolph Tidemann. Kom tilbake når du har funnet svaret!</div>

      <button type="button" id="go-btn">OK, GO!</button>

      <div id="task-options">
        <button type="button" class="option-btn" data-answer="Han ror">Han ror</button>
        <button type="button" class="option-btn" data-answer="Han fisker">Han fisker</button>
        <button type="button" class="option-btn" data-answer="Han synger en lang sang">Han synger en lang sang</button>
        <button type="button" class="option-btn" data-answer="Han styrer båten">Han styrer båten</button>
      </div>
    </div>

    <button id="logout">Ikke deg? <u>Bytt bruker</u></button>
  </div>

  <!-- ===================== RESULT SCREEN ===================== -->
  <div id="result-screen" class="screen">
    <h1 id="result-title">Riktig!</h1>
    <p>Går tilbake til innlogging...</p>
  </div>

  <!-- ===================== COUNTDOWN BAR (shared) ===================== -->
  <div id="countdown-bar">
    <div id="countdown-bar-fill"></div>
  </div>

  <!-- ===================== DEBUG / SETTINGS ===================== -->
  <button id="debug-toggle" title="Innstillinger">⚙</button>
  <div id="debug-panel">
    <h2>Solution 2 – tidsstyring</h2>
    <label>
      Tid før nedtelling vises (s)
      <input type="number" id="cfg-before" value="5" min="0" step="1">
    </label>
    <label>
      Nedtelling, varighet (s)
      <input type="number" id="cfg-countdown" value="10" min="1" step="1">
    </label>
    <label>
      Nedtoning skjerm (ms)
      <input type="number" id="cfg-fadeout" value="1000" min="0" step="100">
    </label>
    <label>
      Resultatskjerm, varighet (s)
      <input type="number" id="cfg-result" value="5" min="1" step="1">
    </label>
    <div id="debug-status"></div>
  </div>

  <script>
    (function () {
      "use strict";

      // ---- Config (live-editable via the settings panel) ----
      let TIME_BEFORE_MS = 5000;   // mission visible, bar hidden – reading time
      let COUNTDOWN_MS = 10000;    // visible countdown before auto-return
      let FADE_OUT_MS = 1000;      // task screen fade-out on OK GO / countdown end
      let RESULT_DISPLAY_MS = 5000;

      // ---- Elements ----
      const loginScreen = document.getElementById("login-screen");
      const taskScreen = document.getElementById("task-screen");
      const resultScreen = document.getElementById("result-screen");
      const resultTitle = document.getElementById("result-title");
      const loginForm = document.getElementById("login-form");
      const loginId = document.getElementById("login-id");
      const loginSubmit = document.getElementById("login-submit");
      const loginError = document.getElementById("login-error");
      const taskMeta = document.getElementById("task-meta");
      const taskQuestion = document.getElementById("task-question");
      const taskHint = document.getElementById("task-hint");
      const goBtn = document.getElementById("go-btn");
      const taskOptions = document.getElementById("task-options");
      const optionButtons = Array.from(document.querySelectorAll(".option-btn"));
      const logout = document.getElementById("logout");
      const countdownBar = document.getElementById("countdown-bar");
      const countdownBarFill = document.getElementById("countdown-bar-fill");

      const CORRECT_ANSWER = "Han ror";

      const debugToggle = document.getElementById("debug-toggle");
      const debugPanel = document.getElementById("debug-panel");
      const cfgBefore = document.getElementById("cfg-before");
      const cfgCountdown = document.getElementById("cfg-countdown");
      const cfgFadeout = document.getElementById("cfg-fadeout");
      const cfgResult = document.getElementById("cfg-result");
      const debugStatus = document.getElementById("debug-status");

      // ---- State ----
      let beforeTimer = null, beforeEndsAt = null;
      let countdownRaf = null, countdownTimer = null, countdownStartedAt = null;
      let countdownEndsAt = null, countdownTotalMs = 0;
      let fadeReturnTimer = null, isFadingOut = false;
      let statusTicker = null;
      let loginCount = 0;
      let isAnswerMode = false;

      // ================= Login =================

      loginId.addEventListener("input", () => {
        loginId.value = loginId.value.replace(/\D/g, "").slice(0, 4);
        loginSubmit.classList.toggle("enabled", loginId.value.length === 4);
        loginError.textContent = "";
      });

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        if (loginId.value.length !== 4) {
          loginError.textContent = "Skriv inn en 4-sifret kode.";
          return;
        }
        loginCount += 1;
        enterTaskScreen();
      });

      function enterTaskScreen() {
        readConfig();
        // 1st login: find mode (OK GO!); later logins: answer mode.
        isAnswerMode = loginCount % 2 === 0;

        taskMeta.textContent = isAnswerMode
          ? "Oppdrag 2 av 6 – velg riktig svar"
          : "Oppdrag 2 av 6";
        goBtn.classList.toggle("visible", !isAnswerMode);
        taskHint.style.display = isAnswerMode ? "none" : "block";
        taskOptions.classList.toggle("visible", isAnswerMode);

        loginScreen.style.display = "none";
        resultScreen.style.display = "none";
        isFadingOut = false;
        taskScreen.style.transitionDuration = "0ms";
        taskScreen.style.opacity = "1";
        taskScreen.style.display = "flex";

        hideCountdown();
        // Mission is visible right away; the bar only appears once the reading
        // window has passed, then it counts down to a fade-out and return.
        beforeEndsAt = Date.now() + TIME_BEFORE_MS;
        beforeTimer = setTimeout(function () {
          startCountdown(COUNTDOWN_MS, fadeOutTask);
        }, TIME_BEFORE_MS);

        startStatusTicker();
      }

      function returnToLogin() {
        clearTimers();
        stopStatusTicker();
        hideCountdown();
        isFadingOut = false;
        taskScreen.style.display = "none";
        taskScreen.style.transitionDuration = "0ms";
        taskScreen.style.opacity = "1";
        resultScreen.style.display = "none";
        loginScreen.style.display = "flex";
        loginId.value = "";
        loginSubmit.classList.remove("enabled");
        loginId.focus();
      }

      // Fade the task/question screen out over FADE_OUT_MS, then return to
      // login. Triggered by "OK, GO!" and by the countdown running out.
      function fadeOutTask() {
        if (isFadingOut) return;
        isFadingOut = true;
        if (beforeTimer) { clearTimeout(beforeTimer); beforeTimer = null; }
        cancelCountdown();
        beforeEndsAt = null;
        countdownEndsAt = null;
        hideCountdown();
        readConfig();
        taskScreen.style.transitionDuration = FADE_OUT_MS + "ms";
        taskScreen.style.opacity = "0";
        fadeReturnTimer = setTimeout(returnToLogin, FADE_OUT_MS);
      }

      function clearTimers() {
        if (beforeTimer) { clearTimeout(beforeTimer); beforeTimer = null; }
        if (fadeReturnTimer) { clearTimeout(fadeReturnTimer); fadeReturnTimer = null; }
        cancelCountdown();
        beforeEndsAt = null;
        countdownEndsAt = null;
      }

      // ================= Countdown bar =================

      // Visible countdown bar. Runs for `totalMs`, then fires `onComplete`.
      // A setTimeout drives the completion (robust even if rAF is throttled);
      // rAF only animates the bar.
      function startCountdown(totalMs, onComplete) {
        cancelCountdown();
        if (beforeTimer) { clearTimeout(beforeTimer); beforeTimer = null; }
        beforeEndsAt = null;
        countdownTotalMs = totalMs;
        countdownStartedAt = Date.now();
        countdownEndsAt = countdownStartedAt + totalMs;
        countdownBar.classList.add("visible");
        countdownTimer = setTimeout(function () {
          countdownTimer = null;
          if (typeof onComplete === "function") onComplete();
        }, totalMs);
        tickCountdown();
      }

      function tickCountdown() {
        const elapsed = Date.now() - countdownStartedAt;
        const fraction = countdownTotalMs > 0 ? Math.min(1, elapsed / countdownTotalMs) : 1;
        countdownBarFill.style.transform = "scaleX(" + (1 - fraction) + ")";
        if (fraction < 1) {
          countdownRaf = requestAnimationFrame(tickCountdown);
        } else {
          countdownRaf = null;
        }
      }

      function cancelCountdown() {
        if (countdownRaf) { cancelAnimationFrame(countdownRaf); countdownRaf = null; }
        if (countdownTimer) { clearTimeout(countdownTimer); countdownTimer = null; }
        countdownStartedAt = null;
      }

      function hideCountdown() {
        cancelCountdown();
        countdownEndsAt = null;
        countdownBar.classList.remove("visible");
        countdownBarFill.style.transform = "scaleX(1)";
      }

      function readConfig() {
        TIME_BEFORE_MS = Math.max(0, Number(cfgBefore.value) || 0) * 1000;
        COUNTDOWN_MS = Math.max(1, Number(cfgCountdown.value) || 1) * 1000;
        FADE_OUT_MS = Math.max(0, Number(cfgFadeout.value) || 0);
        RESULT_DISPLAY_MS = Math.max(1, Number(cfgResult.value) || 1) * 1000;
      }

      // ================= Actions =================

      // "OK, GO!" – the user has read the mission and is off to find it.
      // Fade the screen out, then return to login.
      goBtn.addEventListener("click", fadeOutTask);

      // Logout – always available.
      logout.addEventListener("click", returnToLogin);

      // Answer selection (only meaningful in answer mode). Wired to pointer
      // events for the same multitouch reasons as the original prototype.
      optionButtons.forEach((button) => {
        button.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          button.classList.add("pressed");
        });
        const release = () => button.classList.remove("pressed");
        button.addEventListener("pointercancel", release);
        button.addEventListener("pointerleave", release);
        button.addEventListener("pointerup", (e) => {
          e.preventDefault();
          button.classList.remove("pressed");
          if (!isAnswerMode) return;
          selectAnswer(button.dataset.answer);
        });
      });

      function selectAnswer(answer) {
        clearTimers();
        stopStatusTicker();
        hideCountdown();
        taskScreen.style.display = "none";
        showResult(answer === CORRECT_ANSWER);
      }

      function showResult(correct) {
        readConfig();
        resultTitle.textContent = correct ? "Riktig!" : "Feil svar";
        resultScreen.classList.toggle("correct", correct);
        resultScreen.classList.toggle("incorrect", !correct);
        resultScreen.style.display = "flex";
        // Same countdown bar runs on the result screen before returning.
        startCountdown(RESULT_DISPLAY_MS, returnToLogin);
      }

      // ================= Debug panel =================

      debugToggle.addEventListener("click", () => {
        debugPanel.classList.toggle("open");
      });

      [cfgBefore, cfgCountdown, cfgFadeout, cfgResult].forEach((input) => {
        input.addEventListener("change", readConfig);
      });

      function startStatusTicker() {
        stopStatusTicker();
        statusTicker = setInterval(updateStatus, 100);
        updateStatus();
      }

      function stopStatusTicker() {
        if (statusTicker) { clearInterval(statusTicker); statusTicker = null; }
        debugStatus.textContent = "";
      }

      function updateStatus() {
        const now = Date.now();
        let state, detail;

        if (countdownEndsAt) {
          state = "NEDTELLING";
          detail = Math.max(0, (countdownEndsAt - now) / 1000).toFixed(1) + "s til innlogging";
        } else if (beforeEndsAt) {
          state = "LESER";
          detail = Math.max(0, (beforeEndsAt - now) / 1000).toFixed(1) + "s til nedtelling vises";
        } else {
          state = "IDLE";
          detail = "-";
        }

        debugStatus.textContent =
          "Status: " + state + "\n" +
          detail + "\n" +
          "modus: " + (isAnswerMode ? "svar" : "finn (OK GO!)");
      }

      // Init
      loginId.focus();
    })();
  </script>
</body>
</html>
