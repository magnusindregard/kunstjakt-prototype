<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kunstjakt – Figma-prototype</title>
<style>
  :root {
    --white: #ffffff;
    --ink: #1e1e1d;
    --yellow: #ffe700;
    --blue: #209bd3;
    --blue-dark: #166d95;
    --pink: #e13082;
    --green: #217b39;
    --lightgreen: #b3d181;
    --lightblue: #addbe9;
    --orange: #ffbd72;
    --gray-border: #7e7e7e;
    --font: 'Museet Sans Text', 'Helvetica Neue', Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--white);
    font-family: var(--font);
    color: var(--ink);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- Scaled 1600x900 stage ---------- */
  #viewport {
    position: fixed;
    inset: 0;
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #stage {
    position: relative;
    width: 1600px;
    height: 900px;
    background: var(--white);
    overflow: hidden;
    transform: scale(var(--s, 1));
    transform-origin: center center;
    flex: 0 0 auto;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: none;
  }
  .screen.active { display: block; }

  .blob {
    position: absolute;
    pointer-events: none;
    display: block;
  }

  /* ---------- Badge "3" ---------- */
  .badge {
    position: absolute;
    width: 102px;
    height: 107px;
  }
  .badge img { width: 100%; height: 100%; display: block; }
  .badge span {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    color: var(--ink);
    padding-bottom: 2px;
  }

  /* ---------- Text ---------- */
  .wordmark {
    position: absolute;
    left: 86px;
    top: 396px;
    transform: translateY(-50%);
    font-size: 350px;
    line-height: 1;
    letter-spacing: -7px;
    white-space: nowrap;
  }
  .tagline {
    position: absolute;
    left: 94px;
    top: 718px;
    width: 560px;
    font-size: 40px;
    line-height: 1.2;
  }

  /* ---------- Buttons ---------- */
  .btn-start {
    position: absolute;
    left: 1241px;
    top: 713px;
    height: 106px;
    padding: 0 51px;
    display: inline-flex;
    align-items: center;
    gap: 17px;
    background: var(--orange);
    border: none;
    border-radius: 8.48px;
    box-shadow: 0 4px 0 0 var(--ink);
    font-family: var(--font);
    font-size: 38px;
    color: var(--ink);
    cursor: pointer;
  }
  .btn-start img { width: 42px; height: 32px; display: block; }
  .btn-start:active { transform: translateY(2px); box-shadow: 0 2px 0 0 var(--ink); }

  .btn-ferdig {
    position: absolute;
    left: 1389px;
    top: 769px;
    height: 76px;
    padding: 0 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--orange);
    border: 2.12px solid var(--gray-border);
    border-radius: 8.48px;
    font-family: var(--font);
    font-size: 28px;
    color: var(--ink);
    cursor: pointer;
  }
  .btn-ferdig:active { transform: scale(0.97); }

  /* ---------- Task screen ---------- */
  #painting {
    position: absolute;
    left: 778px;
    top: 215px;
    width: 637px;
    height: auto;
    display: block;
  }
  #task.answer-mode #painting { left: 795px; top: 143px; }

  #question {
    position: absolute;
    left: 78px;
    top: 472px;
    transform: translateY(-50%);
    width: 683px;
    font-size: 34px;
    line-height: 1.2;
    letter-spacing: -0.68px;
    white-space: pre-line;
  }
  #task.answer-mode #question { top: 418px; }

  #options {
    position: absolute;
    left: 78px;
    top: 742px;
    width: 1120px;
    display: none;
    flex-wrap: wrap;
    gap: 32px;
  }
  #task.answer-mode #options { display: flex; }

  .option-btn {
    height: 76px;
    padding: 0 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--orange);
    border: 2.12px solid var(--gray-border);
    border-radius: 8.48px;
    font-family: var(--font);
    font-size: 28px;
    color: var(--ink);
    cursor: pointer;
    touch-action: manipulation;
  }
  .option-btn:active, .option-btn.pressed { transform: scale(0.96); }

  /* Revealable content (hold-to-reveal) */
  #reveal {
    opacity: 0;
    transition-property: opacity;
    transition-timing-function: ease;
    transition-duration: 0ms;
  }

  /* ---------- Hold circle ---------- */
  #hold-zone {
    position: absolute;
    left: 1366px;
    top: 697px;
    width: 159px;
    height: 159px;
  }
  #hold-circle {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--blue);
    cursor: pointer;
    touch-action: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 0 0 0 rgba(32,155,211,0.4);
  }
  #hold-circle.active {
    transform: scale(1.06);
    box-shadow: 0 0 0 16px rgba(32,155,211,0.18);
  }
  #hold-circle { overflow: hidden; }
  #hold-hand {
    position: absolute;
    left: 50%;
    top: 60%;
    transform: translate(-50%,-50%);
    width: 58px;
    pointer-events: none;
  }
  #hold-text {
    position: absolute;
    left: 0; right: 0;
    top: 30px;
    text-align: center;
    color: #fff;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 0.5px;
    pointer-events: none;
    transition-property: opacity;
    transition-timing-function: ease;
    transition-duration: 0ms;
  }

  /* ---------- Result screen ---------- */
  #result-graphic-correct {
    position: absolute;
    left: 647px;
    top: 102px;
    width: 306px;
    display: none;
  }
  #result.correct #result-graphic-correct { display: block; }

  #result-graphic-wrong {
    position: absolute;
    left: 706px;
    top: 204px;
    width: 194px;
    display: none;
  }
  #result.wrong #result-graphic-wrong { display: block; }
  #result-graphic-wrong .flower { width: 194px; display: block; }
  #result-graphic-wrong .x {
    position: absolute;
    left: 54px;
    top: 58px;
    width: 85px;
  }

  #result .r-blob { display: none; }
  #result.correct .r-blob { display: block; }

  #result-title {
    position: absolute;
    left: 50%;
    top: 500px;
    transform: translate(-50%, -50%);
    font-size: 96px;
    letter-spacing: -1.92px;
    white-space: nowrap;
    line-height: 1;
    text-align: center;
  }
  #result-sub {
    position: absolute;
    left: 50%;
    top: 640px;
    transform: translate(-50%, -50%);
    width: 640px;
    font-size: 40px;
    line-height: 1.2;
    letter-spacing: -0.4px;
    text-align: center;
  }
  #progress {
    position: absolute;
    left: 78px;
    top: 760px;
    width: 150px;
    display: block;
  }
  #progress-text {
    position: absolute;
    left: 78px;
    top: 812px;
    font-size: 25px;
    letter-spacing: -0.25px;
    white-space: nowrap;
  }

  /* ---------- Countdown bar ---------- */
  #countdown-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 6px;
    background: rgba(0,0,0,0.06);
    z-index: 30;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  #countdown-bar.visible { opacity: 1; }
  #countdown-bar-fill {
    height: 100%;
    width: 100%;
    background: var(--blue);
    transform-origin: left center;
  }

  /* ---------- Debug / settings ---------- */
  #debug-toggle {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 40;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid #ccc;
    background: #fff;
    color: #666;
    font-size: 16px;
    cursor: pointer;
  }
  #debug-panel {
    position: fixed;
    top: 52px; right: 12px;
    z-index: 40;
    width: 290px;
    background: #1e2126;
    color: #eee;
    border-radius: 12px;
    padding: 16px;
    font-family: -apple-system, Arial, sans-serif;
    font-size: 13px;
    display: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  #debug-panel.open { display: block; }
  #debug-panel h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
    color: #9aa; margin: 0 0 10px;
  }
  #debug-panel label {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; margin-bottom: 9px;
  }
  #debug-panel input {
    width: 66px; padding: 4px 6px; border-radius: 6px;
    border: 1px solid #444; background: #14161a; color: #eee; font-size: 13px;
  }
  #debug-status {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid #333;
    font-family: ui-monospace, Menlo, monospace; font-size: 12px;
    line-height: 1.6; color: #9aa; white-space: pre;
  }
</style>
</head>
<body>

<div id="viewport">
  <div id="stage">

    <!-- ===================== ATTRACT (Frame 58) ===================== -->
    <div id="attract" class="screen active">
      <img class="blob" src="assets/blob58-d.svg" style="left:855px;top:-235px;width:304px">
      <img class="blob" src="assets/blob58-a.svg" style="left:507px;top:-150px;width:370px">
      <img class="blob" src="assets/blob58-b.svg" style="left:981px;top:-138px;width:436px">
      <img class="blob" src="assets/blob58-e.svg" style="left:1220px;top:202px;width:268px">
      <img class="blob" src="assets/blob58-c.svg" style="left:838px;top:695px;width:438px">
      <img class="blob" src="assets/blob-bottomleft.svg" style="left:-140px;top:1002px;width:334px">

      <div class="badge" style="left:94px;top:91px"><img src="assets/badge.svg"><span>3</span></div>
      <div class="wordmark">Kunstjakt</div>
      <div class="tagline">Bli med og få alle riktige!<br>Meld deg på i resepsjonen.</div>
      <button class="btn-start" id="btn-start">Start <img src="assets/arrow.svg"></button>
    </div>

    <!-- ===================== TASK (Frame 59 / 70) ===================== -->
    <div id="task" class="screen">
      <!-- always-visible decoration -->
      <img class="blob" src="assets/blob59-topright.svg" style="left:1156px;top:-216px;width:444px">
      <img class="blob" src="assets/blob59-bottom.svg" style="left:775px;top:856px;width:438px">
      <img class="blob" src="assets/blob-bottomleft.svg" style="left:-90px;top:648px;width:320px">
      <div class="badge" style="left:78px;top:91px"><img src="assets/badge.svg"><span>3</span></div>

      <!-- revealable content -->
      <div id="reveal">
        <img id="painting" src="assets/painting.png">
        <div id="question"></div>
        <div id="options">
          <button type="button" class="option-btn" data-answer="Han ror">Han ror</button>
          <button type="button" class="option-btn" data-answer="Han fisker">Han fisker</button>
          <button type="button" class="option-btn" data-answer="Han synger en lang sang">Han synger en lang sang</button>
          <button type="button" class="option-btn" data-answer="Han styrer båten">Han styrer båten</button>
        </div>
      </div>

      <!-- hold circle -->
      <div id="hold-zone">
        <div id="hold-circle">
          <span id="hold-text">Hold</span>
          <img id="hold-hand" src="assets/hold-hand.svg">
        </div>
      </div>
    </div>

    <!-- ===================== RESULT (Frame 55 / 56) ===================== -->
    <div id="result" class="screen">
      <img class="blob r-blob" src="assets/blob55-c.svg" style="left:775px;top:-101px;width:425px">
      <img class="blob r-blob" src="assets/blob55-lightblue.svg" style="left:1064px;top:114px;width:423px">
      <img id="result-graphic-correct" src="assets/check-star.svg">
      <div id="result-graphic-wrong">
        <img class="flower" src="assets/flower.svg">
        <img class="x" src="assets/x-icon.svg">
      </div>

      <div class="badge" style="left:78px;top:91px"><img src="assets/badge.svg"><span>3</span></div>
      <div id="result-title"></div>
      <div id="result-sub"></div>

      <img id="progress" src="assets/progress-3of6.svg">
      <div id="progress-text">Du har nå klart 3 av 6 oppgaver!</div>
      <button class="btn-ferdig" id="btn-ferdig">Ferdig</button>
    </div>

  </div>
</div>

<!-- ===================== COUNTDOWN BAR ===================== -->
<div id="countdown-bar"><div id="countdown-bar-fill"></div></div>

<!-- ===================== DEBUG / SETTINGS ===================== -->
<button id="debug-toggle" title="Innstillinger">⚙</button>
<div id="debug-panel">
  <h2>Timeout-mekanikk</h2>
  <label>Inaktivitet før nedtelling (s)<input type="number" id="cfg-init-wait" value="10" min="0" step="1"></label>
  <label>Fade inn (ms)<input type="number" id="cfg-fade-in" value="400" min="0" step="50"></label>
  <label>Ventetid før nedtoning (s)<input type="number" id="cfg-grace" value="1" min="0" step="1"></label>
  <label>Nedtoning, varighet (s)<input type="number" id="cfg-fadeout" value="7" min="1" step="1"></label>
  <label>Resultatskjerm, varighet (s)<input type="number" id="cfg-result" value="5" min="1" step="1"></label>
  <div id="debug-status"></div>
</div>

<script>
(function () {
  "use strict";

  // ---- Config ----
  let INIT_WAIT_MS = 10000;
  let FADE_IN_MS = 400;
  let GRACE_MS = 1000;
  let FADE_OUT_MS = 7000;
  let RESULT_DISPLAY_MS = 5000;

  const CORRECT_ANSWER = "Han ror";
  const QUESTION_FIND =
    "Finn maleriet “Brudeferden i Hardanger” av Adolf Tiedemann og Hans Gude fra 1848.\n\n" +
    "På maleriet Brudeferden i Hardanger, hva gjør personen foran?\n\n" +
    "Kom tilbake når du har funnet svaret!";
  const QUESTION_ANSWER =
    "Finn maleriet “Brudeferden i Hardanger” av Adolf Tiedemann og Hans Gude fra 1848.\n\n" +
    "På maleriet Brudeferden i Hardanger, hva gjør personen foran?";

  // ---- Elements ----
  const stage = document.getElementById("stage");
  const attractScreen = document.getElementById("attract");
  const taskScreen = document.getElementById("task");
  const resultScreen = document.getElementById("result");
  const btnStart = document.getElementById("btn-start");
  const btnFerdig = document.getElementById("btn-ferdig");
  const reveal = document.getElementById("reveal");
  const question = document.getElementById("question");
  const options = document.getElementById("options");
  const optionButtons = Array.from(document.querySelectorAll(".option-btn"));
  const holdCircle = document.getElementById("hold-circle");
  const holdText = document.getElementById("hold-text");
  const resultTitle = document.getElementById("result-title");
  const resultSub = document.getElementById("result-sub");
  const countdownBar = document.getElementById("countdown-bar");
  const countdownFill = document.getElementById("countdown-bar-fill");

  const debugToggle = document.getElementById("debug-toggle");
  const debugPanel = document.getElementById("debug-panel");
  const cfgInitWait = document.getElementById("cfg-init-wait");
  const cfgFadeIn = document.getElementById("cfg-fade-in");
  const cfgGrace = document.getElementById("cfg-grace");
  const cfgFadeout = document.getElementById("cfg-fadeout");
  const cfgResult = document.getElementById("cfg-result");
  const debugStatus = document.getElementById("debug-status");

  // ---- State ----
  let sessionCount = 0;
  let isAnswerMode = false;
  let holding = false;
  let idleTimer = null, idleEndsAt = null;
  let graceTimer = null, fadeOutTimer = null;
  let graceEndsAt = null, fadeOutEndsAt = null;
  let resultTimer = null;
  let countdownRaf = null, countdownStartedAt = null, countdownTotalMs = 0;
  let statusTicker = null;

  // ---- Responsive scale ----
  function fitStage() {
    const s = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    stage.style.setProperty("--s", s);
  }
  window.addEventListener("resize", fitStage);
  fitStage();

  // ================= Config =================
  function readConfig() {
    INIT_WAIT_MS = Math.max(0, Number(cfgInitWait.value) || 0) * 1000;
    FADE_IN_MS = Math.max(0, Number(cfgFadeIn.value) || 0);
    GRACE_MS = Math.max(0, Number(cfgGrace.value) || 0) * 1000;
    FADE_OUT_MS = Math.max(1, Number(cfgFadeout.value) || 1) * 1000;
    RESULT_DISPLAY_MS = Math.max(1, Number(cfgResult.value) || 1) * 1000;
  }
  [cfgInitWait, cfgFadeIn, cfgGrace, cfgFadeout, cfgResult].forEach(function (i) {
    i.addEventListener("change", readConfig);
  });
  debugToggle.addEventListener("click", function () { debugPanel.classList.toggle("open"); });

  // ================= Screen switching =================
  function showScreen(el) {
    [attractScreen, taskScreen, resultScreen].forEach(function (s) { s.classList.remove("active"); });
    el.classList.add("active");
  }

  function returnToAttract() {
    clearAllTimers();
    stopStatusTicker();
    hideCountdown();
    resultScreen.classList.remove("correct", "wrong");
    showScreen(attractScreen);
  }

  // ================= Start a session =================
  btnStart.addEventListener("click", function () {
    sessionCount += 1;
    isAnswerMode = (sessionCount % 2 === 0); // 1st visit: find; 2nd visit: answer
    enterTask();
  });

  function enterTask() {
    taskScreen.classList.toggle("answer-mode", isAnswerMode);
    question.textContent = isAnswerMode ? QUESTION_ANSWER : QUESTION_FIND;

    resetReveal();
    showScreen(taskScreen);

    readConfig();
    idleEndsAt = Date.now() + INIT_WAIT_MS;
    idleTimer = setTimeout(onIdleTimeout, INIT_WAIT_MS);
    startStatusTicker();
  }

  function onIdleTimeout() {
    idleTimer = null; idleEndsAt = null;
    startCountdown(FADE_OUT_MS);
    startFadeOut();
  }

  // ================= Hold / fade mechanic =================
  function resetReveal() {
    clearAllTimers();
    holding = false;
    holdCircle.classList.remove("active");
    reveal.style.transitionDuration = "0ms";
    reveal.style.opacity = "0";
    reveal.style.pointerEvents = "none";
    showHoldText(0);
    hideCountdown();
  }

  function clearAllTimers() {
    if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
    if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }
    if (fadeOutTimer) { clearTimeout(fadeOutTimer); fadeOutTimer = null; }
    if (resultTimer) { clearTimeout(resultTimer); resultTimer = null; }
    idleEndsAt = graceEndsAt = fadeOutEndsAt = null;
  }

  function hideHoldText(ms) { holdText.style.transitionDuration = ms + "ms"; holdText.style.opacity = "0"; }
  function showHoldText(ms) { holdText.style.transitionDuration = ms + "ms"; holdText.style.opacity = "1"; }

  function fadeInContent() {
    clearAllTimers();
    readConfig();
    reveal.style.transitionDuration = FADE_IN_MS + "ms";
    reveal.style.opacity = "1";
    reveal.style.pointerEvents = "auto";
  }

  function onHoldStart(e) {
    if (e) e.preventDefault();
    holding = true;
    holdCircle.classList.add("active");
    hideCountdown();
    hideHoldText(FADE_IN_MS);
    fadeInContent();
  }

  function onHoldEnd() {
    if (!holding) return;
    holding = false;
    holdCircle.classList.remove("active");
    clearAllTimers();
    readConfig();
    graceEndsAt = Date.now() + GRACE_MS;
    graceTimer = setTimeout(startFadeOut, GRACE_MS);
    startCountdown(GRACE_MS + FADE_OUT_MS);
  }

  function startFadeOut() {
    readConfig();
    reveal.style.transitionDuration = FADE_OUT_MS + "ms";
    reveal.style.opacity = "0";
    showHoldText(FADE_OUT_MS);
    fadeOutEndsAt = Date.now() + FADE_OUT_MS;
    fadeOutTimer = setTimeout(returnToAttract, FADE_OUT_MS);
  }

  holdCircle.addEventListener("pointerdown", onHoldStart);
  holdCircle.addEventListener("pointerup", onHoldEnd);
  holdCircle.addEventListener("pointercancel", onHoldEnd);
  holdCircle.addEventListener("pointerleave", onHoldEnd);

  // ================= Answer selection =================
  optionButtons.forEach(function (button) {
    button.addEventListener("pointerdown", function (e) { e.preventDefault(); button.classList.add("pressed"); });
    const release = function () { button.classList.remove("pressed"); };
    button.addEventListener("pointercancel", release);
    button.addEventListener("pointerleave", release);
    button.addEventListener("pointerup", function (e) {
      e.preventDefault();
      button.classList.remove("pressed");
      if (!isAnswerMode) return;
      // only respond once content is revealed
      if (getComputedStyle(reveal).opacity < 0.5) return;
      selectAnswer(button.dataset.answer);
    });
  });

  function selectAnswer(answer) {
    clearAllTimers();
    stopStatusTicker();
    hideCountdown();
    showResult(answer === CORRECT_ANSWER);
  }

  function showResult(correct) {
    readConfig();
    resultScreen.classList.remove("correct", "wrong");
    resultScreen.classList.add(correct ? "correct" : "wrong");
    resultTitle.textContent = correct ? "Bra, Kristine!" : "Ai, nesten!";
    resultSub.textContent = correct ? "Personen foran ror båten. Godt sett!" : "Ta en titt til!";
    showScreen(resultScreen);
    resultTimer = setTimeout(returnToAttract, RESULT_DISPLAY_MS);
    startCountdown(RESULT_DISPLAY_MS);
  }

  btnFerdig.addEventListener("click", returnToAttract);

  // ================= Countdown bar =================
  function startCountdown(totalMs) {
    cancelCountdown();
    countdownTotalMs = totalMs;
    countdownStartedAt = Date.now();
    countdownBar.classList.add("visible");
    tickCountdown();
  }
  function tickCountdown() {
    const elapsed = Date.now() - countdownStartedAt;
    const frac = countdownTotalMs > 0 ? Math.min(1, elapsed / countdownTotalMs) : 1;
    countdownFill.style.transform = "scaleX(" + (1 - frac) + ")";
    if (frac < 1) countdownRaf = requestAnimationFrame(tickCountdown);
  }
  function cancelCountdown() {
    if (countdownRaf) { cancelAnimationFrame(countdownRaf); countdownRaf = null; }
    countdownStartedAt = null;
  }
  function hideCountdown() {
    cancelCountdown();
    countdownBar.classList.remove("visible");
    countdownFill.style.transform = "scaleX(1)";
  }

  // ================= Debug status =================
  function startStatusTicker() { stopStatusTicker(); statusTicker = setInterval(updateStatus, 100); updateStatus(); }
  function stopStatusTicker() { if (statusTicker) { clearInterval(statusTicker); statusTicker = null; } debugStatus.textContent = ""; }
  function updateStatus() {
    const now = Date.now();
    let state, detail;
    if (holding) { state = "HOLDING"; detail = "oppgave synlig"; }
    else if (fadeOutEndsAt) { state = "TONER NED"; detail = Math.max(0, (fadeOutEndsAt - now) / 1000).toFixed(1) + "s til attract"; }
    else if (graceEndsAt) { state = "VENTER"; detail = Math.max(0, (graceEndsAt - now) / 1000).toFixed(1) + "s til nedtoning"; }
    else if (idleEndsAt) { state = "VENTER PÅ BERØRING"; detail = Math.max(0, (idleEndsAt - now) / 1000).toFixed(1) + "s til auto-nedtelling"; }
    else { state = "IDLE"; detail = "-"; }
    debugStatus.textContent = "Status: " + state + "\n" + detail + "\nmodus: " + (isAnswerMode ? "svar" : "finn");
  }
})();
</script>
</body>
