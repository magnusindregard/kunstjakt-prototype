<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kunstjakt – Figma-prototype</title>
<style>
  :root {
    --white: #ffffff;
    --ink: #1e1e1d;
    --yellow: #ffe700;
    --blue: #209bd3;
    --blue-dark: #166d95;
    --pink: #e13082;
    --green: #217b39;
    --lightgreen: #b3d181;
    --lightblue: #addbe9;
    --orange: #ffbd72;
    --gray-border: #7e7e7e;
    --font: 'Museet Sans Text', 'Helvetica Neue', Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--white);
    font-family: var(--font);
    color: var(--ink);
    overflow: hidden;
    overscroll-behavior: none;      /* no rubber-band / pull-to-refresh on iPad Safari */
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    position: fixed;                /* lock the page so Safari can't scroll the shell */
    inset: 0;
    width: 100%;
    -webkit-text-size-adjust: 100%; /* keep font sizes exact when rotating */
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Scaled 1600x1113 stage (fills 1366x950 iPad viewport) ---------- */
  #viewport {
    position: fixed;
    inset: 0;
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #stage {
    position: relative;
    width: 1600px;
    height: 1113px;
    background: var(--white);
    overflow: hidden;
    transform: scale(var(--s, 1));
    transform-origin: center center;
    flex: 0 0 auto;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: none;
  }
  .screen.active { display: block; }

  .blob {
    position: absolute;
    pointer-events: none;
    display: block;
  }

  /* ---------- Badge "3" ---------- */
  .badge {
    position: absolute;
    width: 102px;
    height: 107px;
  }
  .badge img { width: 100%; height: 100%; display: block; }
  .badge span {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    color: var(--ink);
    padding-bottom: 2px;
  }

  /* ---------- Text ---------- */
  .wordmark {
    position: absolute;
    left: 86px;
    top: 489.7px;
    transform: translateY(-50%);
    font-size: 350px;
    line-height: 1;
    letter-spacing: -7px;
    white-space: nowrap;
  }
  .tagline {
    position: absolute;
    left: 94px;
    top: 887.9px;
    width: 560px;
    font-size: 40px;
    line-height: 1.2;
  }

  /* ---------- Buttons ---------- */
  .btn-start {
    position: absolute;
    left: 1241px;
    top: 881.7px;
    height: 106px;
    padding: 0 51px;
    display: inline-flex;
    align-items: center;
    gap: 17px;
    background: var(--orange);
    border: none;
    border-radius: 8.48px;
    box-shadow: 0 4px 0 0 var(--ink);
    font-family: var(--font);
    font-size: 38px;
    color: var(--ink);
    cursor: pointer;
  }
  .btn-start img { width: 42px; height: 32px; display: block; }
  .btn-start:active { transform: translateY(2px); box-shadow: 0 2px 0 0 var(--ink); }

  .btn-ferdig {
    position: absolute;
    left: 1389px;
    top: 951px;
    height: 76px;
    padding: 0 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--orange);
    border: 2.12px solid var(--gray-border);
    border-radius: 8.48px;
    font-family: var(--font);
    font-size: 28px;
    color: var(--ink);
    cursor: pointer;
  }
  .btn-ferdig:active { transform: scale(0.97); }

  /* ---------- Task screen ---------- */
  #painting {
    position: absolute;
    left: 778px;
    top: 265.9px;
    width: 637px;
    height: auto;
    display: block;
  }
  #task.answer-mode #painting { left: 795px; top: 176.8px; }

  #question {
    position: absolute;
    left: 78px;
    top: 583.7px;
    transform: translateY(-50%);
    width: 683px;
    font-size: 34px;
    line-height: 1.2;
    letter-spacing: -0.68px;
    white-space: pre-line;
  }
  #task.answer-mode #question { top: 516.9px; }

  #options {
    position: absolute;
    left: 78px;
    top: 917.6px;
    width: 1120px;
    display: none;
    flex-wrap: wrap;
    gap: 32px;
  }
  #task.answer-mode #options { display: flex; }

  .option-btn {
    height: 76px;
    padding: 0 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--orange);
    border: 2.12px solid var(--gray-border);
    border-radius: 8.48px;
    font-family: var(--font);
    font-size: 28px;
    color: var(--ink);
    cursor: pointer;
    touch-action: manipulation;
  }
  .option-btn:active, .option-btn.pressed { transform: scale(0.96); }

  /* ---------- Welcome layer (shown before first touch) ---------- */
  #welcome-layer {
    position: absolute;
    inset: 0;
    opacity: 1;
    transition-property: opacity;
    transition-timing-function: ease;
    transition-duration: 0ms;
  }
  #welcome-title {
    position: absolute;
    left: 78px;
    top: 461.3px;
    transform: translateY(-50%);
    font-size: 76px;
    line-height: 1;
    letter-spacing: -1.52px;
    white-space: nowrap;
  }
  #welcome-sub {
    position: absolute;
    left: 80px;
    top: 622px;
    transform: translateY(-50%);
    width: 517px;
    font-size: 40px;
    line-height: 1.2;
    letter-spacing: -0.4px;
  }

  /* Revealable content (hold-to-reveal) */
  #reveal {
    opacity: 0;
    transition-property: opacity;
    transition-timing-function: ease;
    transition-duration: 0ms;
  }

  /* ---------- Hold circle ---------- */
  #hold-zone {
    position: absolute;
    left: 1366px;
    top: 862px;
    width: 159px;
    height: 159px;
  }
  #hold-circle {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--blue);
    cursor: pointer;
    touch-action: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 0 0 0 rgba(32,155,211,0.4);
  }
  #hold-circle.active {
    transform: scale(1.06);
    box-shadow: 0 0 0 16px rgba(32,155,211,0.18);
  }
  #hold-circle { overflow: hidden; }
  #hold-hand {
    position: absolute;
    left: 50%;
    top: 60%;
    transform: translate(-50%,-50%);
    width: 58px;
    pointer-events: none;
  }
  #hold-text {
    position: absolute;
    left: 0; right: 0;
    top: 37.1px;
    text-align: center;
    color: #fff;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 0.5px;
    pointer-events: none;
    transition-property: opacity;
    transition-timing-function: ease;
    transition-duration: 0ms;
  }

  /* ---------- Result screen ---------- */
  #result-graphic-correct {
    position: absolute;
    left: 647px;
    top: 126.1px;
    width: 306px;
    display: none; /* replaced by the shape cluster (#burst) on the correct screen */
  }

  #result-graphic-wrong {
    position: absolute;
    left: 706px;
    top: 252.3px;
    width: 194px;
    display: none;
  }
  #result.wrong #result-graphic-wrong { display: block; }
  #result-graphic-wrong .flower { width: 194px; display: block; }
  #result-graphic-wrong .x {
    position: absolute;
    left: 54px;
    top: 71.7px;
    width: 85px;
  }

  #result .r-blob { display: none; } /* decorative blobs no longer used on the correct screen */

  #result-title {
    position: absolute;
    left: 50%;
    top: 618.3px;
    transform: translate(-50%, -50%);
    font-size: 96px;
    letter-spacing: -1.92px;
    white-space: nowrap;
    line-height: 1;
    text-align: center;
  }
  #result-sub {
    position: absolute;
    left: 50%;
    top: 791.5px;
    transform: translate(-50%, -50%);
    width: 640px;
    font-size: 40px;
    line-height: 1.2;
    letter-spacing: -0.4px;
    text-align: center;
  }
  #progress {
    position: absolute;
    left: 78px;
    top: 939.9px;
    width: 150px;
    display: block;
  }
  #progress-text {
    position: absolute;
    left: 78px;
    top: 1004.2px;
    font-size: 25px;
    letter-spacing: -0.25px;
    white-space: nowrap;
  }

  /* ---------- Correct screen: left-aligned text column (matches Figma frame) ---------- */
  #result.correct .badge { display: none; }
  #result.correct #progress { display: none; }

  #result.correct #result-title {
    left: 99px;
    top: 413.7px;
    transform: translateY(-50%);
    width: 458px;
    font-size: 80px;
    line-height: 0.85;
    letter-spacing: -1.6px;
    text-align: left;
    white-space: normal;
  }
  #result.correct #result-sub {
    left: 99px;
    top: 604.7px;
    transform: translateY(-50%);
    width: 458px;
    font-size: 40px;
    line-height: 1.2;
    letter-spacing: -0.4px;
    text-align: left;
  }
  #result.correct #progress-text {
    left: 99px;
    top: 734.6px;
    transform: translateY(-50%);
    font-size: 25.28px;
    letter-spacing: -0.253px;
  }

  /* Ferdig button, correct screen: white with orange offset shadow */
  #result.correct #btn-ferdig {
    left: 1312px;
    top: 928.7px;
    height: 80px;
    padding: 0 40px;
    background: var(--white);
    border: 2.12px solid #949494;
    border-radius: 8.48px;
    box-shadow: 8px 8px 0 0 var(--orange);
    font-size: 34px;
  }
  #result.correct #btn-ferdig:active { transform: translate(2px, 2px); box-shadow: 6px 6px 0 0 var(--orange); }

  /* ---------- Correct screen: shape cluster + explosion/confetti burst ---------- */
  #burst {
    position: absolute;
    left: 557px;
    top: 113.8px;
    width: 955px;
    height: 668px;
    display: none;
    pointer-events: none;
  }
  #result.correct #burst { display: block; }

  #burst .cshape {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--w);
    height: var(--h);
    transform-origin: center center;
    will-change: transform, opacity;
  }
  #burst .cshape img { width: 100%; height: 100%; display: block; }

  /* Non-seed shapes shoot out from the seed and pop into place, staggered */
  #result.correct.play #burst .cshape:not(.seed) {
    opacity: 0;
    animation: burstIn 720ms cubic-bezier(0.34, 1.56, 0.64, 1) var(--delay, 0ms) both;
  }
  @keyframes burstIn {
    0%   { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0.18) rotate(var(--rot)); }
    55%  { opacity: 1; }
    100% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
  }

  /* The green cloud is the seed: small + vibrating, then detonates to full size */
  #result.correct.play #burst .cshape.seed {
    animation: cloudSeed 1500ms ease-out both;
  }
  @keyframes cloudSeed {
    0%   { transform: scale(0.36) translate(0, 0) rotate(0deg); }
    6%   { transform: scale(0.36) translate(-5px, 3px) rotate(-3.5deg); }
    12%  { transform: scale(0.38) translate(5px, -3px) rotate(3.5deg); }
    18%  { transform: scale(0.36) translate(-5px, 4px) rotate(-3.5deg); }
    24%  { transform: scale(0.39) translate(5px, -4px) rotate(3deg); }
    30%  { transform: scale(0.37) translate(-4px, 3px) rotate(-3deg); }
    36%  { transform: scale(0.40) translate(4px, -3px) rotate(2.5deg); }
    42%  { transform: scale(0.42) translate(0, 0) rotate(0deg); }
    56%  { transform: scale(1.14) rotate(0deg); }
    72%  { transform: scale(0.97); }
    100% { transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    #result.correct.play #burst .cshape,
    #result.correct.play #burst .cshape:not(.seed),
    #result.correct.play #burst .cshape.seed { animation: none; opacity: 1; transform: none; }
  }

  /* ---------- Countdown bar ---------- */
  #countdown-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 6px;
    background: rgba(0,0,0,0.06);
    z-index: 30;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  #countdown-bar.visible { opacity: 1; }
  #countdown-bar-fill {
    height: 100%;
    width: 100%;
    background: var(--blue);
    transform-origin: left center;
  }
  #countdown-bar.accent { height: 14px; }
  #countdown-bar.accent #countdown-bar-fill { background: var(--orange); }

  /* ---------- Debug / settings ---------- */
  #debug-toggle {
    position: fixed;
    top: 14.8px; right: 12px;
    z-index: 40;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid #ccc;
    background: #fff;
    color: #666;
    font-size: 16px;
    cursor: pointer;
  }
  #debug-panel {
    position: fixed;
    top: 64.3px; right: 12px;
    z-index: 40;
    width: 290px;
    background: #1e2126;
    color: #eee;
    border-radius: 12px;
    padding: 16px;
    font-family: -apple-system, Arial, sans-serif;
    font-size: 13px;
    display: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  #debug-panel.open { display: block; }
  #debug-panel h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
    color: #9aa; margin: 0 0 10px;
  }
  #debug-panel label {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; margin-bottom: 9px;
  }
  #debug-panel input {
    width: 66px; padding: 4px 6px; border-radius: 6px;
    border: 1px solid #444; background: #14161a; color: #eee; font-size: 13px;
  }
  #debug-status {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid #333;
    font-family: ui-monospace, Menlo, monospace; font-size: 12px;
    line-height: 1.6; color: #9aa; white-space: pre;
  }
</style>
</head>

<script>
(function () {
  "use strict";

  // ---- Config ----
  let INIT_WAIT_MS = 10000;
  let FADE_IN_MS = 400;
  let GRACE_MS = 1000;
  let FADE_OUT_MS = 7000;
  let RESULT_DISPLAY_MS = 5000;

  const CORRECT_ANSWER = "Han ror";
  const QUESTION_FIND =
    "Finn maleriet “Brudeferden i Hardanger” av Adolf Tiedemann og Hans Gude fra 1848.\n\n" +
    "På maleriet Brudeferden i Hardanger, hva gjør personen foran?\n\n" +
    "Kom tilbake når du har funnet svaret!";
  const QUESTION_ANSWER =
    "Finn maleriet “Brudeferden i Hardanger” av Adolf Tiedemann og Hans Gude fra 1848.\n\n" +
    "På maleriet Brudeferden i Hardanger, hva gjør personen foran?";

  // ---- Elements ----
  const stage = document.getElementById("stage");
  const attractScreen = document.getElementById("attract");
  const taskScreen = document.getElementById("task");
  const resultScreen = document.getElementById("result");
  const btnStart = document.getElementById("btn-start");
  const btnFerdig = document.getElementById("btn-ferdig");
  const reveal = document.getElementById("reveal");
  const question = document.getElementById("question");
  const options = document.getElementById("options");
  const optionButtons = Array.from(document.querySelectorAll(".option-btn"));
  const holdCircle = document.getElementById("hold-circle");
  const holdText = document.getElementById("hold-text");
  const welcomeLayer = document.getElementById("welcome-layer");
  const resultTitle = document.getElementById("result-title");
  const resultSub = document.getElementById("result-sub");
  const countdownBar = document.getElementById("countdown-bar");
  const countdownFill = document.getElementById("countdown-bar-fill");

  const debugToggle = document.getElementById("debug-toggle");
  const debugPanel = document.getElementById("debug-panel");
  const cfgInitWait = document.getElementById("cfg-init-wait");
  const cfgFadeIn = document.getElementById("cfg-fade-in");
  const cfgGrace = document.getElementById("cfg-grace");
  const cfgFadeout = document.getElementById("cfg-fadeout");
  const cfgResult = document.getElementById("cfg-result");
  const debugStatus = document.getElementById("debug-status");

  // ---- State ----
  let sessionCount = 0;
  let isAnswerMode = false;
  let holding = false;
  let idleTimer = null, idleEndsAt = null;
  let graceTimer = null, fadeOutTimer = null;
  let graceEndsAt = null, fadeOutEndsAt = null;
  let resultTimer = null;
  let countdownRaf = null, countdownStartedAt = null, countdownTotalMs = 0;
  let statusTicker = null;

  // ---- Responsive scale ----
  // Artboard is 1600x1113 (same ratio as the 1366x950 iPad Pro Safari viewport),
  // so a single uniform scale fills the screen with no letterbox bands.
  const STAGE_W = 1600, STAGE_H = 1113;
  function fitStage() {
    // visualViewport reflects Safari's actual usable area as the toolbar shows/hides.
    const vv = window.visualViewport;
    const w = vv ? vv.width : window.innerWidth;
    const h = vv ? vv.height : window.innerHeight;
    const s = Math.min(w / STAGE_W, h / STAGE_H);
    stage.style.setProperty("--s", s);
  }
  window.addEventListener("resize", fitStage);
  window.addEventListener("orientationchange", fitStage);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fitStage);
    window.visualViewport.addEventListener("scroll", fitStage);
  }
  fitStage();

  // ================= Config =================
  function readConfig() {
    INIT_WAIT_MS = Math.max(0, Number(cfgInitWait.value) || 0) * 1000;
    FADE_IN_MS = Math.max(0, Number(cfgFadeIn.value) || 0);
    GRACE_MS = Math.max(0, Number(cfgGrace.value) || 0) * 1000;
    FADE_OUT_MS = Math.max(1, Number(cfgFadeout.value) || 1) * 1000;
    RESULT_DISPLAY_MS = Math.max(1, Number(cfgResult.value) || 1) * 1000;
  }
  [cfgInitWait, cfgFadeIn, cfgGrace, cfgFadeout, cfgResult].forEach(function (i) {
    i.addEventListener("change", readConfig);
  });
  debugToggle.addEventListener("click", function () { debugPanel.classList.toggle("open"); });

  // ================= Screen switching =================
  function showScreen(el) {
    [attractScreen, taskScreen, resultScreen].forEach(function (s) { s.classList.remove("active"); });
    el.classList.add("active");
  }

  function returnToAttract() {
    clearAllTimers();
    stopStatusTicker();
    hideCountdown();
    resultScreen.classList.remove("correct", "wrong", "play");
    showScreen(attractScreen);
  }

  // ================= Start a session =================
  btnStart.addEventListener("click", function () {
    sessionCount += 1;
    isAnswerMode = (sessionCount % 2 === 0); // 1st visit: find; 2nd visit: answer
    enterTask();
  });

  function enterTask() {
    taskScreen.classList.toggle("answer-mode", isAnswerMode);
    question.textContent = isAnswerMode ? QUESTION_ANSWER : QUESTION_FIND;

    resetReveal();
    showScreen(taskScreen);

    readConfig();
    idleEndsAt = Date.now() + INIT_WAIT_MS;
    idleTimer = setTimeout(onIdleTimeout, INIT_WAIT_MS);
    startStatusTicker();
  }

  function onIdleTimeout() {
    idleTimer = null; idleEndsAt = null;
    startCountdown(FADE_OUT_MS);
    startFadeOut();
  }

  // ================= Hold / fade mechanic =================
  function resetReveal() {
    clearAllTimers();
    holding = false;
    holdCircle.classList.remove("active");
    reveal.style.transitionDuration = "0ms";
    reveal.style.opacity = "0";
    reveal.style.pointerEvents = "none";
    welcomeLayer.style.transitionDuration = "0ms";
    welcomeLayer.style.opacity = "1";
    showHoldText(0);
    hideCountdown();
  }

  function clearAllTimers() {
    if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
    if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }
    if (fadeOutTimer) { clearTimeout(fadeOutTimer); fadeOutTimer = null; }
    if (resultTimer) { clearTimeout(resultTimer); resultTimer = null; }
    idleEndsAt = graceEndsAt = fadeOutEndsAt = null;
  }

  function hideHoldText(ms) { holdText.style.transitionDuration = ms + "ms"; holdText.style.opacity = "0"; }
  function showHoldText(ms) { holdText.style.transitionDuration = ms + "ms"; holdText.style.opacity = "1"; }

  function fadeInContent() {
    clearAllTimers();
    readConfig();
    reveal.style.transitionDuration = FADE_IN_MS + "ms";
    reveal.style.opacity = "1";
    reveal.style.pointerEvents = "auto";
    welcomeLayer.style.transitionDuration = FADE_IN_MS + "ms";
    welcomeLayer.style.opacity = "0";
  }

  function onHoldStart(e) {
    if (e) e.preventDefault();
    holding = true;
    holdCircle.classList.add("active");
    hideCountdown();
    hideHoldText(FADE_IN_MS);
    fadeInContent();
  }

  function onHoldEnd() {
    if (!holding) return;
    holding = false;
    holdCircle.classList.remove("active");
    clearAllTimers();
    readConfig();
    graceEndsAt = Date.now() + GRACE_MS;
    graceTimer = setTimeout(startFadeOut, GRACE_MS);
    startCountdown(GRACE_MS + FADE_OUT_MS);
  }

  function startFadeOut() {
    readConfig();
    reveal.style.transitionDuration = FADE_OUT_MS + "ms";
    reveal.style.opacity = "0";
    showHoldText(FADE_OUT_MS);
    fadeOutEndsAt = Date.now() + FADE_OUT_MS;
    fadeOutTimer = setTimeout(returnToAttract, FADE_OUT_MS);
  }

  holdCircle.addEventListener("pointerdown", onHoldStart);
  holdCircle.addEventListener("pointerup", onHoldEnd);
  holdCircle.addEventListener("pointercancel", onHoldEnd);
  holdCircle.addEventListener("pointerleave", onHoldEnd);

  // ================= Answer selection =================
  optionButtons.forEach(function (button) {
    button.addEventListener("pointerdown", function (e) { e.preventDefault(); button.classList.add("pressed"); });
    const release = function () { button.classList.remove("pressed"); };
    button.addEventListener("pointercancel", release);
    button.addEventListener("pointerleave", release);
    button.addEventListener("pointerup", function (e) {
      e.preventDefault();
      button.classList.remove("pressed");
      if (!isAnswerMode) return;
      // only respond once content is revealed
      if (getComputedStyle(reveal).opacity < 0.5) return;
      selectAnswer(button.dataset.answer);
    });
  });

  function selectAnswer(answer) {
    clearAllTimers();
    stopStatusTicker();
    hideCountdown();
    showResult(answer === CORRECT_ANSWER);
  }

  function showResult(correct) {
    readConfig();
    resultScreen.classList.remove("correct", "wrong", "play");
    resultScreen.classList.add(correct ? "correct" : "wrong");
    resultTitle.textContent = correct ? "Bra, Kristine!" : "Ai, nesten!";
    resultSub.textContent = correct ? "Personen foran ror båten. Godt sett!" : "Ta en titt til!";
    showScreen(resultScreen);
    if (correct) {
      // Restart the burst animation from its first frame each time
      void resultScreen.offsetWidth;
      resultScreen.classList.add("play");
    }
    countdownBar.classList.toggle("accent", correct);
    resultTimer = setTimeout(returnToAttract, RESULT_DISPLAY_MS);
    startCountdown(RESULT_DISPLAY_MS);
  }

  btnFerdig.addEventListener("click", returnToAttract);

  // ================= Countdown bar =================
  function startCountdown(totalMs) {
    cancelCountdown();
    countdownTotalMs = totalMs;
    countdownStartedAt = Date.now();
    countdownBar.classList.add("visible");
    tickCountdown();
  }
  function tickCountdown() {
    const elapsed = Date.now() - countdownStartedAt;
    const frac = countdownTotalMs > 0 ? Math.min(1, elapsed / countdownTotalMs) : 1;
    countdownFill.style.transform = "scaleX(" + (1 - frac) + ")";
    if (frac < 1) countdownRaf = requestAnimationFrame(tickCountdown);
  }
  function cancelCountdown() {
    if (countdownRaf) { cancelAnimationFrame(countdownRaf); countdownRaf = null; }
    countdownStartedAt = null;
  }
  function hideCountdown() {
    cancelCountdown();
    countdownBar.classList.remove("visible", "accent");
    countdownFill.style.transform = "scaleX(1)";
  }

  // ================= Debug status =================
  function startStatusTicker() { stopStatusTicker(); statusTicker = setInterval(updateStatus, 100); updateStatus(); }
  function stopStatusTicker() { if (statusTicker) { clearInterval(statusTicker); statusTicker = null; } debugStatus.textContent = ""; }
  function updateStatus() {
    const now = Date.now();
    let state, detail;
    if (holding) { state = "HOLDING"; detail = "oppgave synlig"; }
    else if (fadeOutEndsAt) { state = "TONER NED"; detail = Math.max(0, (fadeOutEndsAt - now) / 1000).toFixed(1) + "s til attract"; }
    else if (graceEndsAt) { state = "VENTER"; detail = Math.max(0, (graceEndsAt - now) / 1000).toFixed(1) + "s til nedtoning"; }
    else if (idleEndsAt) { state = "VENTER PÅ BERØRING"; detail = Math.max(0, (idleEndsAt - now) / 1000).toFixed(1) + "s til auto-nedtelling"; }
    else { state = "IDLE"; detail = "-"; }
    debugStatus.textContent = "Status: " + state + "\n" + detail + "\nmodus: " + (isAnswerMode ? "svar" : "finn");
  }
})();
</script>
</body>
</html>
